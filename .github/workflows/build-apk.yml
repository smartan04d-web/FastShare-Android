
name: FastShare Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FastShare APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Project Files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort | head -100

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle Permission
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "ERROR: gradlew is missing"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      - name: Check Generated APK
        run: |
          find app/build/outputs/apk \
            -name "*.apk" -type f -print

      - name: Upload FastShare APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FastShare-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FastShare-Build-Reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
